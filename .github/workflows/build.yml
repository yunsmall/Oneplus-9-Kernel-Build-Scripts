name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      config_url:
        description: '.config 文件的 Gist raw URL（可选，留空使用 oneplus9_defconfig）'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison cpio flex libelf-dev libssl-dev \
            make rsync squashfs-tools unzip wget xz-utils \
            clang-18 lld-18 llvm-18 \
            binutils-aarch64-linux-gnu

      - name: Setup build directory
        run: |
          python3 create_oneplus_build.py --download --llvm=18 build

      - name: Copy defconfig
        run: |
          mkdir -p build/out
          if [ -n "$CONFIG_URL" ]; then
            echo "Downloading config from provided URL"
            wget -q -O build/out/.config "$CONFIG_URL"
          else
            echo "Using oneplus9_defconfig from repo"
            cp oneplus9_defconfig build/out/.config
          fi
        env:
          CONFIG_URL: ${{ github.event.inputs.config_url }}

      - name: olddefconfig
        run: |
          source build/env.sh
          make -C "$KERNEL_DIR" O="$OUT_DIR" olddefconfig

      - name: Build
        run: |
          source build/env.sh
          make -C "$KERNEL_DIR" O="$OUT_DIR" vmlinux Image.gz modules -j$(nproc)

      - name: Install modules
        run: |
          source build/env.sh
          make -C "$KERNEL_DIR" O="$OUT_DIR" modules_install \
            INSTALL_MOD_PATH="$PWD/build/modules" INSTALL_MOD_STRIP=1

      - name: Create modules squashfs
        run: |
          mksquashfs build/modules modules.squashfs \
            -comp xz -b 1M -Xbcj arm,armthumb -Xdict-size 1M -noappend

      - name: Upload vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux
          path: build/out/vmlinux

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: build/out/arch/arm64/boot/Image*

      - name: Upload modules squashfs
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: modules.squashfs
